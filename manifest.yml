name: MyChappieCPUScheduler
semantic_id: Runtime.Compute.MyChappieCPUScheduler
version: 0.2.0
language:
  name: zig
  version: 0.16.0

purpose: >-
  Govern local CPU execution using benchmark-derived cost evidence, discover
  atomic Actions dynamically by semantic_id, observe Linux execution cost, and
  delegate durable distributed execution to a sidecar without exposing remote
  topology to the local scheduler.

exports:
  types:
    - CostKnowledge
    - FunctionCostProfile
    - LocalPressure
    - ScheduleDecision
    - ProbeDecision
    - ExecutionLedger
    - DistributedSidecar
    - ActionDescriptor
    - DynamicActionRegistry
    - MeasurementSnapshot
    - LinuxMeasurementPlane
  capabilities:
    - BenchmarkThreshold.P90
    - ComputeCost.Classify
    - CPUScheduler.Evaluate
    - CPUScheduler.ObserveUnknown
    - DynamicActionRegistry.Load
    - DynamicActionRegistry.Resolve
    - DynamicAction.Execute
    - DynamicAction.ExecuteShard
    - DynamicAction.Aggregate
    - LinuxMeasurement.PMU
    - LinuxMeasurement.CgroupV2
    - DistributedSidecar.Submit
    - DistributedSidecar.LeaseShard
    - DistributedSidecar.RetryExpired
    - DistributedSidecar.Speculate
    - DistributedSidecar.CompleteShard
  events:
    - ActionModuleLoaded
    - ActionResolved
    - MeasurementObserved
    - CostProfileLearned
    - LocalExecutionSelected
    - LocalProbeSelected
    - OffloadSelected
    - SplitOffloadSelected
    - ShardLeased
    - ShardRetryRequested
    - ShardSpeculated
    - ShardCompleted
    - DistributedExecutionCompleted

invariants:
  - Atomic Actions are never imported into the runtime; they are dynamic ABI modules.
  - Dynamic modules are resolved by semantic_id and must declare Allas Action ABI v1.
  - CPUScheduler never opens Action modules and never selects remote workers.
  - CPUScheduler never aggregates remote results.
  - LinuxMeasurementPlane observes execution but does not own scheduling policy.
  - PMU permission failure degrades measurement quality instead of failing Action execution.
  - Benchmark cost does not imply distributability.
  - Split execution requires partitionability, retry safety and aggregation semantics.
  - UNKNOWN work is not migrated mid-execution unless checkpointable/offloadable.
  - First valid completion wins for a shard; duplicate completions are idempotent.
  - Remote retry and speculation are sidecar responsibilities.
