scheduler:
  threshold:
    strategy: percentile
    percentile: 90
  overload_cpu_percent: 85
  max_shards: 16

action_runtime:
  abi: allas-action-v1
  discovery: semantic_id
  linkage: dynamic
  runtime_imports_atomic_actions: false
  module_directory: ./zig-out/lib
  require:
    - abi_version
    - semantic_id
    - schema_hash
    - artifact_hash

measurement:
  provider: linux
  cgroup_v2_root: /sys/fs/cgroup
  pmu:
    provider: perf_event_open
    counters:
      - cpu_cycles
      - instructions
      - cache_misses
      - branch_misses
    permission_failure: degrade_to_partial
  cgroup:
    cpu_stat: true
    memory_current: true
    memory_peak: true
    memory_events: true
    cpu_pressure: true
    memory_pressure: true

unknown_mode:
  initial_execution: local_probe
  measurement: required
  offload_after_threshold_requires:
    - offloadable
    - retry_safe
    - checkpointable
  non_checkpointable_policy: finish_local_and_learn

known_mode:
  pre_execution_decision: true
  split_requires:
    - offloadable
    - retry_safe
    - partitionable
    - aggregation

sidecar:
  max_shards: 64
  max_outbox_events: 128
  lease_timeout_ms: 5000
  retry:
    enabled: true
    max_attempts: 5
  speculation:
    enabled: true
    policy: explicit_straggler_signal
  completion:
    shard_policy: first_valid_result_wins
    scheduler_notification: ack_only

validation:
  docker:
    workers: 4
    unknown_mode: local_probe_plus_remote_shards
    known_mode: direct_remote_split

persistence:
  core: adapter
  required_state:
    - execution-ledger
    - outbox
  reference_core_is_in_memory: true
