name: Zig 0.16

on:
  push:
    branches:
      - main
      - 'issue-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - name: Format
        run: |
          zig fmt build.zig src/*.zig actions/*.zig actions/*/*.zig
          git diff --exit-code
      - name: Test
        run: zig build test
      - name: Dynamic Actions + Linux Measurement
        run: zig build action-test
      - name: Docker distributed UNKNOWN + KNOWN
        run: bash scripts/docker-distribution-test.sh
      - name: ReleaseSafe build
        run: zig build -Doptimize=ReleaseSafe
      - name: Demo
        run: zig build run
